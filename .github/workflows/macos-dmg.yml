name: macOS DMG

# Builds MirrorZ-Hecras.dmg on a real Mac runner (required — cannot cross-compile
# from Linux cloud agents). Uploads the DMG as a workflow artifact and, on tags,
# attaches it to a GitHub Release so the landing page can point at a public URL.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build DMG
        env:
          # Ad-hoc sign in CI unless secrets are configured.
          CODESIGN_ID: ${{ secrets.CODESIGN_ID }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: bash packaging/build_macos_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirrorZ-Hecras-macOS-DMG
          path: |
            dist/MirrorZ-Hecras-*.dmg
            landing/downloads/MirrorZ-Hecras-*.dmg
            landing/downloads/MirrorZ-Hecras-*.dmg.sha256
            releases/MirrorZ-Hecras-*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MirrorZ-Hecras-*.dmg
            landing/downloads/MirrorZ-Hecras-*.dmg.sha256
